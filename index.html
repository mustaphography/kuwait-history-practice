<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تدريب تاريخ الكويت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --ink: #1d232b; --muted: #6b7380; --line: #e4e0d6;
  --accent: #0f6e63; --accent-ink: #ffffff; --accent-soft: #e2f1ee;
  --ok: #1f8a4c; --ok-soft: #e3f5ea; --bad: #c43d3d; --bad-soft: #fbe7e7; --warn: #a86a00; --warn-soft: #fdf1d9;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --font: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* dark is the default; the header toggle switches to light */
:root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #12161b; --surface: #1b2128; --ink: #e8ebef; --muted: #9aa3ae; --line: #2a323c;
  --accent: #3fb6a3; --accent-ink: #0c1512; --accent-soft: #173430;
  --ok: #4cc47d; --ok-soft: #173325; --bad: #ef6b6b; --bad-soft: #3a1d1f; --warn: #f0b44c; --warn-soft: #3a2e17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.6; }
#app { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }

.top { margin-bottom: 16px; }
.title-actions { display: flex; gap: 8px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 12px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 12px; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; font-weight: 600; }
.chips button small { font-weight: 400; color: var(--muted); font-size: .72rem; }
.chips button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips button.on small { color: inherit; opacity: .85; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.badge:not(:empty) { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; font-size: .75rem; margin-inline-start: 4px; }
.score { display: flex; gap: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score .ok { color: var(--ok); } .score .bad { color: var(--bad); } .score .st { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); }
.card.pop { animation: pop .22s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag:empty { display: none; }
.tag.soft { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.q { font-size: 1.25rem; font-weight: 700; margin: 4px 0 20px; line-height: 1.7; }

.choices { display: grid; gap: 10px; }
.choices.tf { grid-template-columns: 1fr 1fr; }
.choice { display: flex; align-items: center; gap: 12px; text-align: start; width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 1.02rem; transition: border-color .12s, background .12s, transform .08s; }
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choice:active:not(:disabled) { transform: scale(.99); }
.choice .k { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); color: var(--muted); font-size: .85rem; font-weight: 700; }
.choice:disabled { cursor: default; }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.correct .k { background: var(--ok); color: #fff; }
.choice.chosen-wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
.choice.chosen-wrong .k { background: var(--bad); color: #fff; }
.choice.dim { opacity: .5; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.feedback { margin-top: 18px; padding: 16px; border-radius: 14px; animation: pop .2s ease-out; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.verdict { font-weight: 800; font-size: 1.1rem; }
.feedback.ok .verdict { color: var(--ok); } .feedback.bad .verdict { color: var(--bad); }
.answer { margin-top: 6px; }
.explain { margin-top: 8px; color: var(--ink); opacity: .85; font-size: .95rem; }
.primary { margin-top: 14px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 10px 22px; border-radius: 12px; }
.ghost { border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 10px; font-weight: 600; }
.ghost.danger { color: var(--bad); }
.hint { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 14px; }
@media (hover: none) { .hint { display: none; } }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

dialog { border: 0; border-radius: 20px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100% - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg { padding: 22px; }
.dlg h3 { margin: 0 0 14px; } .dlg h4 { margin: 18px 0 8px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.kpis div { background: var(--bg); border-radius: 12px; padding: 10px; text-align: center; }
.kpis b { display: block; font-size: 1.3rem; } .kpis span { color: var(--muted); font-size: .8rem; }
.bar { display: grid; grid-template-columns: 70px 1fr 56px; align-items: center; gap: 10px; font-size: .85rem; margin: 6px 0; }
.track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); }
.weak { padding-inline-start: 20px; margin: 0; max-height: 240px; overflow: auto; }
.weak li { margin: 4px 0; font-size: .88rem; }
.weak li em { color: var(--muted); font-style: normal; margin-inline-start: 8px; font-size: .78rem; }
.muted { color: var(--muted); }
.dlg-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.dlg-actions .primary { margin: 0; }

@media (max-width: 520px) {
  .card { padding: 18px; border-radius: 16px; }
  .q { font-size: 1.1rem; }
  .choices.tf { grid-template-columns: 1fr; }
}

.fig { display: flex; justify-content: center; margin: -6px 0 18px; padding: 12px; background: var(--bg); border-radius: 14px; overflow-x: auto; }
.fig svg, .choice svg, .answer svg { color: var(--ink); max-width: 100%; height: auto; }
.choice .t svg { display: block; }
.fig text, .choice svg text, .answer svg text { fill: currentColor; font-family: var(--font); }
svg .zero { fill: var(--surface); }
.fig svg .zero { fill: var(--bg); }
.choice.correct svg .zero { fill: var(--ok-soft); }
.choice.chosen-wrong svg .zero { fill: var(--bad-soft); }

.tag.soft.short, .tag.soft.open { border-color: var(--accent); color: var(--accent); }
.sa { display: flex; gap: 10px; }
.sa input, textarea { flex: 1; width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; outline: none; }
.sa input:focus, textarea:focus { border-color: var(--accent); }
.sa input:disabled { opacity: .7; }
.sa .primary, #showBtn { margin-top: 0; }
textarea { resize: vertical; margin-bottom: 12px; display: block; }
.small { font-size: .88rem; margin: -8px 0 12px; }
.mine { text-decoration: line-through; opacity: .8; }
.feedback.neutral { background: var(--accent-soft); }
.model { margin-top: 6px; line-height: 1.8; }
.fb-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.fb-actions .primary, .fb-actions .ghost { margin-top: 0; }
.primary.okb { background: var(--ok); } .primary.badb { background: var(--bad); color: #fff; }
.primary:disabled { opacity: .5; cursor: default; }

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
// HST102 — Kuwait History question bank.
// Tables: each row is one fact; every template asks that fact from a different angle.
// Items: hand-written facts with several question variants.
// Lists: "which of these is / is NOT one of ..." sets.
// To add a lesson: add rows/items/lists with the new lesson number and add it to `lessons`.

window.DECK = {
  id: "hst102",
  title: "تاريخ الكويت — HST102",
  lang: "ar",
  shortRate: 0.5, // share of short-answer-capable questions asked as typed answers
  lessons: [
    { n: 1, name: "تدوين تاريخ الكويت" },
    { n: 2, name: "الخليج العربي وملامح الكويت" },
    { n: 3, name: "العتوب الآباء المؤسسون" },
  ],

  tables: [
    {
      id: "books", lesson: 1, label: "الكتب والمؤلفات",
      numeric: ["year"],
      extra: { year: ["1936", "1950", "1971", "1955"] },
      explain: "«{title}» — {author}{yearText}. {desc}",
      templates: [
        { ask: "author", q: "من مؤلف كتاب «{title}»؟", short: true },
        { ask: "title", q: "أي من الكتب التالية من تأليف {author}؟" },
        { ask: "year", q: "في أي عام صدر كتاب «{title}»؟", short: true },
        { ask: "title", q: "أي كتاب صدر عام {year}م؟", short: true },
        { ask: "author", q: "من المؤلف الذي صدر كتابه عن تاريخ الكويت عام {year}م؟", short: true },
        { ask: ["author", "year"], q: "كتاب «{title}»: من مؤلفه ومتى صدر؟" },
        { ask: "title", q: "أي كتاب ينطبق عليه الوصف التالي: {desc}" },
        { ask: "author", q: "{desc} — من مؤلف هذا الكتاب؟", short: true },
        { tf: "author", q: "كتاب «{title}» من تأليف {author}." },
        { tf: "year", q: "صدر كتاب «{title}» عام {year}م." },
      ],
      rows: [
        { id: "rashid", title: "تاريخ الكويت", author: "عبد العزيز الرشيد", year: "1926",
          desc: "أهم وأول كتاب محلي تناول تاريخ إمارة الكويت، ويُعد أول سجل مدوّن موسّع لتاريخها منذ التأسيس." },
        { id: "qenaei", title: "صفحات من تاريخ الكويت", author: "يوسف بن عيسى القناعي", year: "1946",
          desc: "ثاني أهم كتاب محلي عن تاريخ الكويت، وهو موجز مبسط لأبناء المدارس." },
        { id: "shamlan", title: "مِن تاريخ الكويت", author: "سيف مرزوق الشملان", year: "1959",
          desc: "يتناول بشكل مركّز مظاهر مختلفة من الجوانب السياسية للكويت." },
        { id: "khazal", title: "تاريخ الكويت السياسي", author: "حسين خزعل", year: "1962",
          desc: "يتكون من خمسة أجزاء (صدر الجزء الأول 1962م) وتناول التاريخ بتوسع من حيث التفاصيل والشخصيات." },
        { id: "abuhakima", title: "تاريخ الكويت – الجزء الأول (لجنة تاريخ الكويت)", author: "أحمد مصطفى أبو حاكمة", year: "1967",
          desc: "كتبه منفرداً بعد قرار اللجنة عام 1965م، وكان معبّراً عن نمط جديد في كتابة تاريخ الإمارة." },
        { id: "lorimer", title: "سجل الأحداث في الخليج وعمان ووسط الجزيرة", author: "ج. ج. لوريمر", year: "",
          desc: "عُرف لاحقاً باسم «دليل الخليج»، وهو موسوعة تاريخية وجغرافية وإحصائية للمبعوثين البريطانيين." },
        { id: "dickson1", title: "الكويت وجاراتها", author: "هارولد ديكسون", year: "",
          desc: "أحد كتابَي المعتمد السياسي البريطاني في الكويت." },
        { id: "dickson2", title: "عرب الصحراء", author: "هارولد ديكسون", year: "",
          desc: "أحد كتابَي المعتمد السياسي البريطاني في الكويت." },
        { id: "niebuhr", title: "وصف شبه جزيرة العرب", author: "كارستن نيبور", year: "",
          desc: "يحتوي على خريطة تظهر عليها تسمية «القرين»." },
      ],
    },

    {
      id: "westerners", lesson: 1, label: "الكويت بعيون غربية",
      numeric: ["year"],
      explain: "{person}: {role}{yearText}. {deed}",
      templates: [
        { ask: "role", q: "ما صفة «{person}» الذي كتب عن الكويت؟" },
        { ask: "person", q: "من هو {role} الذي كتب عن الكويت؟", short: true },
        { ask: "year", q: "ما السنة المرتبطة بـ«{person}» في المصادر الغربية عن الكويت؟", short: true },
        { ask: "person", q: "أي شخصية غربية ترتبط بعام {year}م؟" },
        { ask: "person", q: "من الذي {deed}؟", short: true },
        { ask: "deed", q: "ماذا فعل/كتب «{person}» عن الكويت؟" },
        { ask: ["person", "year"], q: "من {role}، ومتى ارتبط اسمه بالكويت؟" },
        { tf: "role", q: "«{person}» هو {role}." },
        { tf: "year", q: "ارتبط «{person}» بالكويت عام {year}م." },
      ],
      rows: [
        { id: "niebuhr", person: "كارستن نيبور", role: "رحالة زار المنطقة لاستكشافها", year: "1761",
          deed: "زار المنطقة عام 1761م لاستكشافها، وتظهر على خريطته تسمية «القرين»" },
        { id: "buckingham", person: "باكنجهام", role: "الرحالة والصحفي الإنجليزي", year: "1816",
          deed: "قال: «الكويت مستقلة، والكويتيون أكثر أهل الخليج حبّاً للحرية والإقدام»" },
        { id: "lusher", person: "لوشر", role: "الرحالة الأمريكي", year: "1868",
          deed: "وصف الكويت بأنها «متطورة ونظيفة عن غيرها من المدن» وقدّر سكانها بين 15 و20 ألف نسمة" },
        { id: "taylor", person: "روبرت تيلور", role: "مساعد الوكيل السياسي في العراق", year: "1818",
          deed: "كتب تقريراً وثائقياً تناول تاريخ العتوب" },
        { id: "warden", person: "فرانسيس واردن", role: "أحد موظفي حكومة بومباي الإنجليزية", year: "1819",
          deed: "كتب مقالة عن العتوب وتأسيس السلطة" },
        { id: "lorimer", person: "ج. ج. لوريمر", role: "موظف الإدارة البريطانية الهندية", year: "",
          deed: "ألّف أهم مؤلَّف غربي موسّع: «سجل الأحداث في الخليج وعمان ووسط الجزيرة» (دليل الخليج)" },
        { id: "brydges", person: "هارفرد جونز بريدجز", role: "المعتمد السياسي لشركة الهند الشرقية في البصرة", year: "1784",
          deed: "عمل معتمداً سياسياً لشركة الهند الشرقية في البصرة اعتباراً من 1784م وكتب عن الكويت" },
        { id: "pelly", person: "لويس بيلي", role: "المقيم السياسي البريطاني في بوشهر", year: "1863 و1865",
          deed: "زار الكويت مرتين (1863م و1865م)، وذكر أن أول الشيوخ أقبل عبر خور بوبيان" },
        { id: "dickson", person: "هارولد ديكسون", role: "المعتمد السياسي البريطاني في الكويت", year: "1929–1959",
          deed: "ألّف «الكويت وجاراتها» و«عرب الصحراء»، وعاش في الكويت فترات بين 1929 و1959م" },
        { id: "stocqueler", person: "ستوكويلر", role: "الرحالة البريطاني", year: "1831",
          deed: "ذكر أن بحارة السفينة الكويتية «الناصري» نحو خمسين بحاراً كلهم من الكويت أو القرين" },
      ],
    },

    {
      id: "timeline", lesson: 0, label: "التواريخ",
      numeric: ["year"],
      explain: "{event}: {year}م.",
      templates: [
        { ask: "year", q: "متى كان/كانت: {event}؟", short: true },
        { ask: "event", q: "ماذا حدث عام {year}م؟" },
        { tf: "year", q: "{event} كان عام {year}م." },
      ],
      rows: [
        { id: "rashid", lesson: 1, event: "طباعة كتاب «تاريخ الكويت» لعبد العزيز الرشيد", year: "1926" },
        { id: "qenaei", lesson: 1, event: "صدور «صفحات من تاريخ الكويت» ليوسف القناعي", year: "1946" },
        { id: "shamlan", lesson: 1, event: "صدور «مِن تاريخ الكويت» لسيف مرزوق الشملان", year: "1959" },
        { id: "committee", lesson: 1, event: "تشكيل لجنة كتابة تاريخ الكويت", year: "1959" },
        { id: "khazal", lesson: 1, event: "صدور الجزء الأول من «تاريخ الكويت السياسي» لحسين خزعل", year: "1962" },
        { id: "abuhakima65", lesson: 1, event: "قرار اللجنة الاستعانة بأحمد أبو حاكمة لاستكمال كتابة التاريخ منفرداً", year: "1965" },
        { id: "abuhakima67", lesson: 1, event: "طبع «تاريخ الكويت – الجزء الأول» (لجنة تاريخ الكويت)", year: "1967" },
        { id: "niebuhr", lesson: 1, event: "زيارة كارستن نيبور للمنطقة لاستكشافها", year: "1761" },
        { id: "brydges", lesson: 1, event: "بدء عمل هارفرد جونز بريدجز معتمداً سياسياً في البصرة", year: "1784" },
        { id: "buckingham", lesson: 1, event: "زيارة الرحالة الإنجليزي باكنجهام للكويت", year: "1816" },
        { id: "taylor", lesson: 1, event: "تقرير روبرت تيلور الوثائقي عن العتوب", year: "1818" },
        { id: "warden", lesson: 1, event: "مقالة فرانسيس واردن عن العتوب وتأسيس السلطة", year: "1819" },
        { id: "stocqueler", lesson: 3, event: "حديث ستوكويلر عن بحارة السفينة «الناصري»", year: "1831" },
        { id: "pelly", lesson: 1, event: "زيارتا لويس بيلي للكويت", year: "1863 و1865" },
        { id: "lusher", lesson: 1, event: "زيارة الرحالة الأمريكي لوشر وتقديره سكان الكويت", year: "1868" },
        { id: "suez", lesson: 2, event: "افتتاح قناة السويس (وتراجع النشاط البحري في الخليج)", year: "1869" },
        { id: "karmali", lesson: 3, event: "مقال الأب أنستاس الكرملي عن أصل اسم الكويت", year: "1904" },
        { id: "oil", lesson: 2, event: "الاحتفال بتصدير أول شحنة من النفط الكويتي", year: "1946" },

    { id: "open-committee", lesson: 1, variants: [{ open: "ما الدافع إلى تشكيل «لجنة كتابة تاريخ الكويت» عام 1959م؟ ومن اقترحها ومن أعضاؤها؟",

      q.shortOk = true;
      q.accept = uniq(t.rows.filter((r) => given.every((g) => r[g] === row[g])).map((r) => r[ask[0]]));
      q.reject = uniq([...t.rows.map((r) => r[ask[0]]), ...((t.extra || {})[ask[0]] || [])]).filter((v) => v && !q.accept.includes(v));
    }
    return q;
  }
  const withFig = (q, tpl, row) => (tpl.fig ? { ...q, fig: fill(tpl.fig, row) } : q);

  function mcq(q, a, wrong, explain) {
    const choices = shuffle([a, ...sample(wrong, 3)]);
    return { kind: "mcq", q, choices, correct: choices.indexOf(a), explain };
  }
  function tf(q, truth, explain) {
    return { kind: "tf", q, choices: [T.true, T.false], correct: truth ? 0 : 1, explain };
  }

  // ---------- facts ----------
  // fact = { id, lesson, variants: [() => question|null] }
  const FACTS = [];
  for (const t of D.tables || []) {
    for (const row of t.rows) {
      const variants = t.templates.map((tpl) => () => tableQuestion(t, row, tpl))
        .filter((_, i) => { const tpl = t.templates[i]; const need = [...placeholders(tpl.q + (tpl.fig || "")), ...(tpl.ask ? [].concat(tpl.ask) : [])]; return need.every((f) => row[f]); });
      FACTS.push({ id: t.id + ":" + row.id, lesson: row.lesson ?? t.lesson, group: t.label, variants });
    }
  }
  for (const L of D.lists || []) {
    const explain = L.label + ": " + L.members.join(" • ");
    const variants = [
      () => mcq(AR ? `أي مما يلي من ${L.label}؟` : `Which of these is one of: ${L.label}?`, L.members[rnd(L.members.length)], L.distractors, explain),
      () => L.members.length >= 3 ? mcq(AR ? `أي مما يلي ليس من ${L.label}؟` : `Which of these is NOT one of: ${L.label}?`, L.distractors[rnd(L.distractors.length)], L.members, explain) : null,
      () => { const truth = Math.random() < 0.5; const x = truth ? L.members[rnd(L.members.length)] : L.distractors[rnd(L.distractors.length)];
              return tf(AR ? `«${x}» من ${L.label}.` : `"${x}" is one of: ${L.label}.`, truth, explain); },
    ];
    FACTS.push({ id: "list:" + L.id, lesson: L.lesson, group: L.label, variants });
  }
  for (const it of D.items || []) {
    const variants = it.variants.map((v0) => () => {
      const v = typeof v0 === "function" ? v0() : v0;
      if (!v) return null;
      if (v.open) return { kind: "open", q: v.open, model: v.model, explain: v.explain || it.explain };
      const q = v.tf !== undefined ? tf(v.tf, v.answer, v.explain || it.explain) : mcq(v.q, v.a, v.wrong, v.explain || it.explain);
      if (v.short) { q.shortOk = true; q.accept = [v.a, ...(v.accept || [])]; q.reject = v.wrong; }
      return v.fig ? { ...q, fig: v.fig } : q;
    });
    FACTS.push({ id: "item:" + it.id, lesson: it.lesson, group: "", variants });
  }

  // ---------- scheduler ----------
  const BOX_W = [8, 5, 3, 1.6, 0.9, 0.5];
  let filterLesson = 0, mode = "smart";
  let counter = 0, recent = [], requeue = [];
  let session = { right: 0, wrong: 0, streak: 0 };
  let current = null;

  const pool = () => FACTS.filter((f) => filterLesson ? f.lesson === filterLesson : (!D.activeLessons || D.activeLessons.includes(f.lesson)));
  const isMistake = (f) => { const s = S.facts[f.id]; return s && s.wrong > 0 && s.box < 2; };
  const weight = (f) => { const s = S.facts[f.id]; return !s || !s.seen ? 4 : BOX_W[s.box]; };

  function pickFact() {
    let candidates = pool();
    if (mode === "mistakes") {
      const m = candidates.filter(isMistake);
      if (m.length) candidates = m; else { mode = "smart"; toast(T.noMistakes); renderTop(); }
    }
    const due = requeue.findIndex((r) => r.at <= counter && candidates.some((f) => f.id === r.id));
    if (due >= 0) { const r = requeue.splice(due, 1)[0]; return { fact: FACTS.find((f) => f.id === r.id), avoid: r.avoid, again: true }; }
    const fresh = candidates.filter((f) => !recent.includes(f.id));
    const list = fresh.length ? fresh : candidates;
    let total = list.reduce((s, f) => s + weight(f), 0), x = Math.random() * total;
    for (const f of list) { x -= weight(f); if (x <= 0) return { fact: f }; }
    return { fact: list[list.length - 1] };
  }

  function buildQuestion() {
    for (let tries = 0; tries < 20; tries++) {
      const { fact, avoid, again } = pickFact();
      // least-used variant first, skipping the one just missed
      const order = fact.variants.map((_, i) => i)
        .filter((i) => fact.variants.length === 1 || i !== avoid)
        .sort((a, b) => ((S.variants[fact.id + "#" + a] || 0) - (S.variants[fact.id + "#" + b] || 0)) || Math.random() - 0.5);
      for (const vi of order) {
        let q = fact.variants[vi]();
        if (!q) continue;
        if (q.shortOk && Math.random() < (D.shortRate || 0))
          q = { kind: "short", q: q.q, fig: q.fig, answerText: q.choices[q.correct], accept: q.accept, reject: q.reject, explain: q.explain };
        return { ...q, fact, vi, again: again && vi !== avoid };
      }
    }
    return null;
  }

  function answer(i) {
    if (!current || current.answered) return;
    const ok = i === current.correct;
    record(ok);
    renderFeedback(i, ok);
  }

  let undo = null;
  function record(ok) {
    current.answered = true;
    const s = fs(current.fact.id);
    undo = { fact: { ...s }, total: { ...S.total }, session: { ...session }, requeue: requeue.length };
    s.seen++; s.label = current.q.slice(0, 90);
    S.variants[current.fact.id + "#" + current.vi] = (S.variants[current.fact.id + "#" + current.vi] || 0) + 1;
    if (ok) { s.right++; s.box = Math.min(5, s.box + 1); S.total.right++; session.right++; session.streak++; }
    else {
      s.wrong++; s.box = 0; S.total.wrong++; session.wrong++; session.streak = 0;
      requeue.push({ id: current.fact.id, at: counter + 3 + rnd(3), avoid: current.vi });
    }
    save();
    renderTop();
  }
  function overrideToCorrect() {
    if (!undo) return;
    S.facts[current.fact.id] = undo.fact; S.total = undo.total; session = undo.session; requeue.length = undo.requeue;
    S.variants[current.fact.id + "#" + current.vi]--;
    record(true);
    undo = null;
  }

  function answerShort() {
    if (!current || current.answered) return;
    const input = app.querySelector("#saInput").value;
    if (!input.trim()) return;
    const ok = grade(input, current.accept, current.reject);
    record(ok);
    app.querySelector("#saInput").disabled = true;
    app.querySelector("#saCheck").disabled = true;
    const card = app.querySelector("#card"), fb = card.querySelector("#fb");
    fb.hidden = false;
    fb.className = "feedback " + (ok ? "ok" : "bad");
    fb.innerHTML = `
      <div class="verdict">${ok ? "✓ " + T.right : "✗ " + T.wrong}</div>
      ${ok ? "" : `<div class="answer">${T.yourAnswer} <span class="mine">${esc(input)}</span></div>`}
      <div class="answer">${T.correctIs} <b>${esc(current.answerText)}</b></div>
      ${current.explain ? `<div class="explain">${esc(current.explain).replace(/\n/g, "<br>")}</div>` : ""}
      <div class="fb-actions">
        <button class="primary" id="nextBtn">${T.next} ${AR ? "←" : "→"}</button>
        ${ok ? "" : `<button class="ghost" id="overrideBtn">${T.override}</button>`}
      </div>`;
    wireNext(fb);
    const ob = fb.querySelector("#overrideBtn");
    if (ob) ob.onclick = () => {
      overrideToCorrect();
      fb.className = "feedback ok";
      fb.querySelector(".verdict").textContent = "✓ " + T.overridden;
      ob.remove(); fb.querySelector("#nextBtn").focus();
    };
  }

  function revealOpen() {
    const card = app.querySelector("#card"), fb = card.querySelector("#fb");
    card.querySelector("#showBtn").remove();
    const ta = card.querySelector("#openInput"); if (ta) ta.readOnly = true;
    fb.hidden = false; fb.className = "feedback neutral";
    fb.innerHTML = `
      <div class="answer"><b>${T.model}</b></div>
      <div class="model">${esc(current.model).replace(/\n/g, "<br>")}</div>
      <div class="fb-actions">
        <button class="primary okb" id="knewBtn">${T.iKnew}</button>
        <button class="primary badb" id="didntBtn">${T.iDidnt}</button>
      </div>`;
    const rate = (ok) => {
      record(ok);
      fb.className = "feedback " + (ok ? "ok" : "bad");
      fb.querySelector(".fb-actions").innerHTML = `<button class="primary" id="nextBtn">${T.next} ${AR ? "←" : "→"}</button>`;
      wireNext(fb);
    };
    fb.querySelector("#knewBtn").onclick = () => rate(true);
    fb.querySelector("#didntBtn").onclick = () => rate(false);
    fb.querySelector("#knewBtn").focus({ preventScroll: true });
  }
  function wireNext(fb) {
    const nb = fb.querySelector("#nextBtn");
    nb.onclick = next; nb.focus({ preventScroll: true });
  }

  function next() {
    counter++;
    current = buildQuestion();
    if (current) { recent.push(current.fact.id); recent = recent.slice(-5); }
    renderQuestion();
  }

  // ---------- UI ----------
  const app = document.getElementById("app");
  document.documentElement.dir = AR ? "rtl" : "ltr";
  document.documentElement.lang = D.lang;
  const THEME_KEY = "quiz-theme";
  const setTheme = (t) => { document.documentElement.dataset.theme = t; try { localStorage.setItem(THEME_KEY, t); } catch (e) {} };
  let theme = "dark";
  try { theme = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) {}
  document.documentElement.dataset.theme = theme;
  app.innerHTML = `
    <header class="top">
      <div class="title-row">
        <h1>${esc(D.title)}</h1>
        <div class="title-actions">
          <button class="ghost" id="themeBtn" aria-label="Toggle light/dark">${theme === "dark" ? "☀️" : "🌙"}</button>
          <button class="ghost" id="statsBtn">${T.stats}</button>
        </div>
      </div>
      <div class="chips" id="lessons"></div>
      <div class="row">
        <div class="seg" id="modes">
          <button data-mode="smart">${T.smart}</button>
          <button data-mode="mistakes">${T.mistakes} <span class="badge" id="mistakeCount"></span></button>
        </div>
        <div class="score" id="score"></div>
      </div>
    </header>
    <main class="card" id="card"></main>
    <p class="hint">${T.keys}</p>
    <div class="toast" id="toast"></div>
    <dialog id="stats"></dialog>`;

  const lessonsEl = app.querySelector("#lessons");
  lessonsEl.innerHTML = [{ n: 0, name: T.all }, ...D.lessons].map((l) =>
    `<button data-l="${l.n}" title="${esc(l.name)}">${l.n ? `${T.lesson} ${l.n}<small>${esc(l.name)}</small>` : (D.activeLessons ? `${T.lesson} ${D.activeLessons.join(" + ")}<small>${AR ? "كل ما في الاختبار" : "Quiz scope"}</small>` : T.all)}</button>`).join("");
  lessonsEl.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; filterLesson = +b.dataset.l; requeue = []; renderTop(); next(); };
  app.querySelector("#modes").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; mode = b.dataset.mode; renderTop(); next(); };
  app.querySelector("#statsBtn").onclick = openStats;
  app.querySelector("#themeBtn").onclick = (e) => {
    theme = theme === "dark" ? "light" : "dark"; setTheme(theme);
    e.currentTarget.textContent = theme === "dark" ? "☀️" : "🌙";
  };

  function renderTop() {
    lessonsEl.querySelectorAll("button").forEach((b) => b.classList.toggle("on", +b.dataset.l === filterLesson));
    app.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
    const mc = pool().filter(isMistake).length;
    app.querySelector("#mistakeCount").textContent = mc || "";
    app.querySelector("#score").innerHTML =
      `<span class="ok">✓ ${session.right}</span><span class="bad">✗ ${session.wrong}</span><span class="st">🔥 ${session.streak}</span>`;
  }

  function renderQuestion() {
    const card = app.querySelector("#card");
    if (!current) { card.innerHTML = `<p>${T.none}</p>`; return; }
    const q = current;
    const lesson = D.lessons.find((l) => l.n === q.fact.lesson);
    card.innerHTML = `
      <div class="meta">
        <span class="tag">${lesson ? `${T.lesson} ${lesson.n}` : ""}</span>
        <span class="tag soft ${q.kind}">${{ tf: T.tf, mcq: T.mcq, short: T.short, open: T.open }[q.kind]}</span>
        ${q.again ? `<span class="tag warn">↻ ${T.again}</span>` : ""}
      </div>
      <h2 class="q">${esc(q.q)}</h2>
      ${q.fig ? `<div class="fig">${q.fig}</div>` : ""}
      ${q.kind === "short" ? `
      <form class="sa" id="saForm" autocomplete="off">
        <input id="saInput" type="text" placeholder="${T.typeHere}" autocomplete="off" spellcheck="false">
        <button class="primary" id="saCheck" type="submit">${T.check}</button>
      </form>` : q.kind === "open" ? `
      <p class="muted small">${T.openHint}</p>
      <textarea id="openInput" rows="4" placeholder="${T.writeHere}"></textarea>
      <button class="primary" id="showBtn">${T.show}</button>` : `
      <div class="choices ${q.kind}">
        ${q.choices.map((c, i) => `<button class="choice" data-i="${i}"><span class="k">${i + 1}</span><span class="t">${raw(c)}</span></button>`).join("")}
      </div>`}
      <div class="feedback" id="fb" hidden></div>`;
    if (q.kind === "short") {
      card.querySelector("#saForm").onsubmit = (e) => { e.preventDefault(); answerShort(); };
      card.querySelector("#saInput").focus({ preventScroll: true });
    } else if (q.kind === "open") {
      card.querySelector("#showBtn").onclick = revealOpen;
    } else {
      card.querySelector(".choices").onclick = (e) => { const b = e.target.closest(".choice"); if (b) answer(+b.dataset.i); };
    }
    card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
  }

  function renderFeedback(chosen, ok) {
    const card = app.querySelector("#card");
    card.querySelectorAll(".choice").forEach((b, i) => {
      b.disabled = true;
      if (i === current.correct) b.classList.add("correct");
      else if (i === chosen) b.classList.add("chosen-wrong");
      else b.classList.add("dim");
    });
    const fb = card.querySelector("#fb");
    fb.hidden = false;
    fb.className = "feedback " + (ok ? "ok" : "bad");
    fb.innerHTML = `
      <div class="verdict">${ok ? "✓ " + T.right : "✗ " + T.wrong}</div>
      ${ok ? "" : `<div class="answer">${T.correctIs} <b>${raw(current.choices[current.correct])}</b></div>`}
      ${current.explain ? `<div class="explain">${esc(current.explain).replace(/\n/g, "<br>")}</div>` : ""}
      <button class="primary" id="nextBtn">${T.next} ${AR ? "←" : "→"}</button>`;
    wireNext(fb);
  }

  function openStats() {
    const dlg = app.querySelector("#stats");
    const facts = pool();
    const seen = facts.filter((f) => S.facts[f.id]?.seen);
    const mastered = facts.filter((f) => (S.facts[f.id]?.box || 0) >= 3).length;
    const tot = S.total.right + S.total.wrong;
    const weak = seen.map((f) => ({ f, s: S.facts[f.id] }))
      .filter((x) => x.s.wrong > 0)
      .sort((a, b) => a.s.box - b.s.box || b.s.wrong - a.s.wrong).slice(0, 10);
    const byLesson = D.lessons.map((l) => {
      const fl = FACTS.filter((f) => f.lesson === l.n);
      const m = fl.filter((f) => (S.facts[f.id]?.box || 0) >= 3).length;
      return `<div class="bar"><span>${T.lesson} ${l.n}</span><div class="track"><i style="width:${(100 * m / fl.length).toFixed(0)}%"></i></div><span>${m}/${fl.length}</span></div>`;
    }).join("");
    dlg.innerHTML = `
      <div class="dlg">
        <h3>${T.stats}</h3>
        <div class="kpis">
          <div><b>${tot}</b><span>${T.answered}</span></div>
          <div><b>${tot ? Math.round(100 * S.total.right / tot) : 0}%</b><span>${T.accuracy}</span></div>
          <div><b>${mastered}/${facts.length}</b><span>${T.mastered}</span></div>
        </div>
        ${byLesson}
        <h4>${T.weakest}</h4>
        ${weak.length ? `<ol class="weak">${weak.map((x) => `<li><span>${esc(x.s.label)}</span><em>✗${x.s.wrong} ✓${x.s.right}</em></li>`).join("")}</ol>` : `<p class="muted">${T.none}</p>`}
        <div class="dlg-actions">
          <button class="ghost danger" id="resetBtn">${T.reset}</button>
          <button class="primary" id="closeBtn">${T.close}</button>
        </div>
      </div>`;
    dlg.querySelector("#closeBtn").onclick = () => dlg.close();
    dlg.querySelector("#resetBtn").onclick = () => {
      if (!confirm(T.resetQ)) return;
      S = { facts: {}, variants: {}, total: { right: 0, wrong: 0 } }; save();
      session = { right: 0, wrong: 0, streak: 0 }; requeue = [];
      dlg.close(); renderTop(); next();
    };
    dlg.showModal();
  }

  let toastTimer;
  function toast(msg) {
    const el = app.querySelector("#toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
  }

  document.addEventListener("keydown", (e) => {
    if (app.querySelector("#stats").open) return;
    const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && !e.target.disabled && !e.target.readOnly;
    if (typing || (current && !current.answered && current.kind === "open")) return;
    if (e.target.tagName === "BUTTON" && e.key === "Enter" && e.target.id !== "nextBtn") return;
    if (current && !current.answered) {
      if (!current.choices) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= current.choices.length) answer(n - 1);
    } else if (current && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
  });

  // expose for testing
  window.__quiz = { FACTS, buildQuestion, matches, grade };
  renderTop();
  next();
})();

  </script>
</body>
</html>
